plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.wise.softphone'
    compileSdk 35
    buildToolsVersion '35.0.1'
    ndkVersion '28.2.13676358'
    ndkPath System.getenv('ANDROID_NDK_HOME')

    defaultConfig {
        applicationId 'com.wise.softphone'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets.main.jniLibs.srcDirs = [rootProject.file('../target/android-jni')]
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.games:games-activity:4.4.0'
}

def compileRust = tasks.register('compileRust', Exec) {
    commandLine rootProject.file('build-native.sh')
}
tasks.named('preBuild').configure { dependsOn compileRust }
