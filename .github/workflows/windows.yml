name: Windows distribution

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'windows/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  package:
    # windows-2022 builds binaries that run on Windows 10 and Windows 11.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable zip
        shell: pwsh
        run: ./windows/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: wise-softphone-windows-x64
          path: |
            dist/wise-softphone-*-windows-x64.zip
            dist/wise-softphone-*-windows-x64-setup.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wise-softphone-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
