<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">Settings and logs</title>
<desc id="desc">The Account service stores non-secret JSON settings and optionally saves passwords in the OS keyring. Diagnostics writes rotating local logs at 5 MiB and keeps one previous file.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#17283e}.title{font-size:26px;font-weight:700}.subtitle{font-size:15px;fill:#40536a}.node{font-size:17px;font-weight:700}.detail{font-size:14px;fill:#40536a}.label{font-size:13px;fill:#40536a}</style>
<rect width="1080" height="360" rx="12" fill="#f6f9fd"/>
<text x="32" y="44" class="title">Settings and logs</text>

<rect x="32" y="100" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="157.0" y="131" text-anchor="middle" class="node">Account service</text>
<text x="157.0" y="156" text-anchor="middle" class="detail">Validate and save</text>
<rect x="412" y="100" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="537.0" y="131" text-anchor="middle" class="node">Account JSON</text>
<text x="537.0" y="156" text-anchor="middle" class="detail">Settings, no password</text>
<rect x="792" y="100" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="917.0" y="131" text-anchor="middle" class="node">OS keyring</text>
<text x="917.0" y="156" text-anchor="middle" class="detail">Optional SIP password</text>
<rect x="32" y="252" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="157.0" y="283" text-anchor="middle" class="node">Diagnostics</text>
<text x="157.0" y="308" text-anchor="middle" class="detail">Filtered app and SIP events</text>
<rect x="412" y="252" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="537.0" y="283" text-anchor="middle" class="node">Local log files</text>
<text x="537.0" y="308" text-anchor="middle" class="detail">5 MiB; one previous file</text>
<path d="M282 124 H412" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M157 100 V80 H917 V100" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M282 291 H412" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="347" y="110" text-anchor="middle" class="label">Settings</text>
<text x="537" y="73" text-anchor="middle" class="label">Optional password</text>
<text x="347" y="276" text-anchor="middle" class="label">Append</text>
<text x="876" y="278" text-anchor="middle" class="label">Logs exclude passwords,</text>
<text x="876" y="299" text-anchor="middle" class="label">full SIP messages, and SDP.</text>
</svg>
