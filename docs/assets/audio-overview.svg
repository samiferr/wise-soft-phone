<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">Voice and ringing</title>
<desc id="desc">The SIP/media stack exchanges PCM with Call audio, which captures and plays sound through OS audio devices. The Incoming ringer plays a local alert and releases the speaker before call audio starts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#17283e}.title{font-size:26px;font-weight:700}.subtitle{font-size:15px;fill:#40536a}.node{font-size:17px;font-weight:700}.detail{font-size:14px;fill:#40536a}.label{font-size:13px;fill:#40536a}</style>
<rect width="1080" height="360" rx="12" fill="#f6f9fd"/>
<text x="32" y="44" class="title">Voice and ringing</text>

<rect x="32" y="108" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="157.0" y="139" text-anchor="middle" class="node">SIP/media stack</text>
<text x="157.0" y="164" text-anchor="middle" class="detail">RTP / SRTP voice</text>
<rect x="412" y="108" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="537.0" y="139" text-anchor="middle" class="node">Call audio</text>
<text x="537.0" y="164" text-anchor="middle" class="detail">Mute and input heartbeat</text>
<rect x="792" y="108" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="917.0" y="139" text-anchor="middle" class="node">OS audio devices</text>
<text x="917.0" y="164" text-anchor="middle" class="detail">Microphone and speaker</text>
<rect x="412" y="252" width="250" height="78" rx="10" fill="#fff" stroke="#bdccdf" stroke-width="2"/>
<text x="537.0" y="283" text-anchor="middle" class="node">Incoming ringer</text>
<text x="537.0" y="308" text-anchor="middle" class="detail">Local incoming-call alert</text>
<path d="M282 147 H412" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M662 147 H792" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M662 291 H917 V186" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="347" y="132" text-anchor="middle" class="label">Call PCM</text>
<text x="727" y="132" text-anchor="middle" class="label">Capture / play</text>
<text x="799" y="277" text-anchor="middle" class="label">Alert tone</text>
<text x="207" y="279" text-anchor="middle" class="label">Ringer stops and releases</text>
<text x="207" y="299" text-anchor="middle" class="label">the speaker before answering.</text>
</svg>
