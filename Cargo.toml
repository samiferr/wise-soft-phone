[package]
name = "softphone"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Native voice-only SIP softphone using egui and RVoIP"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "clipboard", "glow", "x11", "wayland"] }
dirs = "6"
cpal = "0.15.3"
keyring = { version = "4.2", features = ["v1"] }
rvoip-audio-device = "=0.4.0"
rvoip-sip = "=0.4.0"
rvoip-sip-core = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev]
debug = 0
incremental = false
strip = "debuginfo"

[profile.release]
strip = "symbols"

[patch.crates-io]
# Preserve outbound-proxy routing for ACK/BYE with private provider Contacts.
rvoip-sip-dialog = { path = "vendor/rvoip-sip-dialog" }
