[package]
name = "softphone"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Native voice-only SIP softphone using egui and RVoIP"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
dirs = "6"
chrono = "0.4"
hound = "3.5"
tempfile = "3"
cpal = "0.15.3"
rvoip-audio-device = "=0.4.0"
rvoip-sip = "=0.4.0"
rvoip-sip-core = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "x11", "wayland"] }
keyring = { version = "4.2", features = ["v1"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["game-activity"] }
eframe = { version = "=0.37.0", default-features = false, features = ["android-game-activity"] }
jni = "0.21"
ndk-context = "0.1"

[profile.dev]
debug = 0
incremental = false
strip = "debuginfo"

[profile.release]
strip = "symbols"

[patch.crates-io]
# Tap decoded PCM without opening another microphone or speaker stream.
rvoip-audio-device = { path = "vendor/rvoip-audio-device" }
# Preserve outbound-proxy routing for ACK/BYE with private provider Contacts.
rvoip-sip-dialog = { path = "vendor/rvoip-sip-dialog" }

# The WebRTC audio processing port is real-time DSP; unoptimized builds are too
# slow for its tests and for debug sessions with a live microphone.
[profile.dev.package."sonora"]
opt-level = 3
[profile.dev.package."sonora-aec3"]
opt-level = 3
[profile.dev.package."sonora-agc2"]
opt-level = 3
[profile.dev.package."sonora-common-audio"]
opt-level = 3
[profile.dev.package."sonora-fft"]
opt-level = 3
[profile.dev.package."sonora-ns"]
opt-level = 3
[profile.dev.package."sonora-simd"]
opt-level = 3
